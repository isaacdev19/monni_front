name: design_system
description: "Theme, tokens and reusable components. No business logic."
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# Fonts are bundled so the app works offline. Use them with
# TextStyle(fontFamily: ..., package: 'design_system'); see MonniFonts.
flutter:
  assets:
    - assets/fonts/inter/OFL.txt
    - assets/fonts/space_grotesk/OFL.txt
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Bold.ttf
          weight: 700
